<!DOCTYPE html>
<!--
  Figo × UFC — plataforma de ideias, orçamento e tempo.
  Arquivo único (HTML + CSS + JS), sem build. Veja o README.md para publicar no GitHub Pages
  e para ligar o compartilhamento em tempo real (Firebase). A configuração fica no objeto CONFIG, no início do código JavaScript.
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Figo × UFC — Ideias, orçamento e tempo</title>
<meta name="theme-color" content="#6D28D9">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpolygon points='10,1 22,1 31,10 31,22 22,31 10,31 1,22 1,10' fill='%236D28D9'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #221B33;
    --quiet: #6E6580;
    --faint: #736A88;
    --line: #E4DEEF;
    --line-strong: #D3C9E6;
    --bg: #F6F4FA;
    --panel: #FFFFFF;
    --accent: #6D28D9;
    --accent-tint: #F1EAFB;
    --accent-ink: #4C1D95;
    --good: #2F6B4F;
    --good-tint: #E7F2EC;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #ECE9F5; --quiet: #A79EBC; --faint: #9A92B4;
      --line: #332B47; --line-strong: #443A5C;
      --bg: #120F1A; --panel: #1E1930;
      --accent: #A78BFA; --accent-tint: #2C2340; --accent-ink: #D9CCFB;
      --good: #6FBF95; --good-tint: #17251E;
    }
  }
  :root[data-theme="dark"] {
    --ink: #ECE9F5; --quiet: #A79EBC; --faint: #9A92B4;
    --line: #332B47; --line-strong: #443A5C;
    --bg: #120F1A; --panel: #1E1930;
    --accent: #A78BFA; --accent-tint: #2C2340; --accent-ink: #D9CCFB;
    --good: #6FBF95; --good-tint: #17251E;
  }
  * { box-sizing: inherit; }
  html, body { min-height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ================= platform shell ================= */
  .shell { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100vh; }

  .side {
    position: sticky; top: 0; height: 100vh; align-self: start;
    display: flex; flex-direction: column; padding: 22px 14px 18px;
    background: var(--panel); border-right: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 11px; padding: 2px 10px 24px; }
  .brand-mark {
    width: 34px; height: 34px; flex: none; background: var(--accent); color: #fff;
    font-weight: 800; font-size: 15px; display: flex; align-items: center; justify-content: center;
    clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%);
  }
  .brand-name { font-weight: 800; font-size: 15px; letter-spacing: -0.01em; line-height: 1.15; }
  .brand-sub { font-size: 11.5px; color: var(--faint); }

  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav button {
    display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
    font-family: inherit; font-size: 13.5px; font-weight: 500; color: var(--quiet);
    background: none; border: none; padding: 10px 11px; border-radius: 9px; cursor: pointer;
  }
  .nav button svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .nav button:hover { background: var(--accent-tint); color: var(--ink); }
  .nav button.on { background: var(--accent-tint); color: var(--accent-ink); font-weight: 600; }
  .nav .badge { margin-left: auto; font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; }

  .side-foot { margin-top: auto; padding: 16px 10px 0; border-top: 1px solid var(--line); }
  .mini-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--quiet); margin-bottom: 7px; }
  .mini-label b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .mini-track { height: 6px; background: var(--accent-tint); border-radius: 4px; overflow: hidden; }
  .mini-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width .35s ease; }
  .sync-note { display: flex; align-items: center; gap: 7px; margin-top: 14px; font-size: 11.5px; color: var(--faint); line-height: 1.3; }
  .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--good); flex: none; }
  .sync-dot.busy { background: var(--faint); animation: pulse 1s ease-in-out infinite; }
  .sync-dot.off { background: var(--faint); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

  .main { padding: 34px 40px 88px; min-width: 0; max-width: 1360px; width: 100%; }
  .topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 26px; }
  .topbar .kicker { font-size: 12.5px; color: var(--accent); font-weight: 600; margin: 0 0 6px; }
  .topbar h1 { margin: 0 0 5px; font-size: 28px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; }
  .topbar .sub { margin: 0; color: var(--quiet); font-size: 14px; max-width: 62ch; line-height: 1.5; }
  .top-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  /* ================= block grid ================= */
  .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 20px; align-items: start; }
  .s12 { grid-column: span 12; } .s8 { grid-column: span 8; } .s7 { grid-column: span 7; }
  .s6 { grid-column: span 6; } .s5 { grid-column: span 5; } .s4 { grid-column: span 4; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px 22px; min-width: 0; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .card-head h2 { margin: 0; font-size: 15.5px; font-weight: 700; letter-spacing: -0.01em; }
  .card-head .hint { font-size: 12px; color: var(--faint); }

  /* stat blocks */
  .stat { padding: 20px 22px; }
  .score-label { font-size: 12px; color: var(--quiet); margin: 0 0 8px; }
  .score-value { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .score-value.accent { color: var(--accent); }
  .score-value.good { color: var(--good); }
  .score-sub { font-size: 12px; color: var(--faint); margin: 6px 0 0; }
  .stat .mini-track { margin-top: 12px; }

  /* ================= balance bars ================= */
  .bar-row { padding: 11px 0; }
  .bar-row + .bar-row { border-top: 1px solid var(--line); }
  .bar-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .bar-name { font-size: 13.5px; font-weight: 500; }
  .bar-figs { font-size: 12.5px; color: var(--quiet); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bar-figs b { color: var(--ink); font-weight: 600; }
  .bar-track { position: relative; height: 9px; background: var(--accent-tint); border-radius: 5px; }
  .bar-fill { position: absolute; top: 0; left: 0; height: 100%; border-radius: 5px; background: var(--accent); transition: width .35s ease; }
  .bar-fill.under-target { background: var(--faint); }
  .bar-target { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: .35; }
  .legend { display: flex; gap: 18px; margin-top: 12px; font-size: 12px; color: var(--faint); flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

  /* ================= buttons & forms ================= */
  .new-idea-toggle {
    display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px;
    background: var(--accent); color: #fff; border: none; border-radius: 999px;
    font-size: 13.5px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .new-idea-toggle:hover { background: var(--accent-ink); }
  .new-idea-toggle .plus { font-size: 16px; line-height: 0; }
  .btn-primary, .btn-ghost { font-family: inherit; font-size: 13.5px; font-weight: 600; border-radius: 8px; padding: 9px 16px; cursor: pointer; }
  .btn-primary { background: var(--accent); color: #fff; border: none; }
  .btn-primary:hover { background: var(--accent-ink); }
  .btn-ghost { background: transparent; color: var(--quiet); border: 1px solid var(--line-strong); }
  .btn-ghost:hover { color: var(--ink); border-color: var(--faint); }
  .icon-btn { background: none; border: none; color: var(--faint); font-size: 12px; cursor: pointer; font-family: inherit; padding: 5px 10px; border-radius: 6px; }
  .icon-btn:hover { color: var(--ink); background: var(--accent-tint); }
  .icon-btn.danger:hover { color: var(--accent); }
  .icon-btn.confirm { color: #fff; background: var(--accent); }
  .icon-btn.confirm:hover { background: var(--accent-ink); color: #fff; }

  .idea-form { border-color: var(--line-strong); }
  .idea-form h3 { margin: 0 0 18px; font-size: 16px; font-weight: 700; }
  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
  .field-grid.cols3 { grid-template-columns: repeat(3, 1fr); }
  .field-grid .full { grid-column: 1 / -1; }
  label.field { display: block; }
  label.field span.lbl { display: block; font-size: 12px; color: var(--quiet); margin-bottom: 5px; }
  input.f, select.f, textarea.f {
    width: 100%; font-family: inherit; font-size: 14px; color: var(--ink);
    padding: 9px 11px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--bg);
  }
  input.f:focus, select.f:focus, textarea.f:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
  textarea.f { resize: vertical; min-height: 54px; }
  .form-actions { display: flex; gap: 10px; margin-top: 20px; }

  select.filter {
    font-family: inherit; font-size: 12.5px; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line-strong); border-radius: 999px; padding: 6px 12px;
  }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; }

  .empty { text-align: center; padding: 40px 20px; color: var(--faint); font-size: 13.5px; border: 1px dashed var(--line-strong); border-radius: 12px; }

  /* ================= idea blocks ================= */
  .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
  .idea-card { border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; background: var(--bg); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .ic-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .ic-cost { font-size: 16px; font-weight: 800; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
  .ic-name { font-size: 15px; font-weight: 600; line-height: 1.3; }
  .ic-meta { font-size: 12.5px; color: var(--quiet); line-height: 1.5; }
  .ic-meta .dot { margin: 0 6px; color: var(--faint); }
  .ic-notes { font-size: 12.5px; color: var(--faint); line-height: 1.5; }
  .ic-actions { display: flex; justify-content: flex-end; gap: 4px; margin-top: auto; padding-top: 8px; }
  .tag { font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
  .tag.status-ideia { background: var(--line); color: var(--quiet); }
  .tag.status-validacao { background: #FBF0D9; color: #92620B; }
  .tag.status-aprovada { background: var(--good-tint); color: var(--good); }

  /* ================= comparison table ================= */
  .table-scroll { overflow-x: auto; margin: 0 -22px -20px; border-top: 1px solid var(--line); border-radius: 0 0 16px 16px; }
  table.compare { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 640px; }
  table.compare th, table.compare td { padding: 11px 16px; text-align: left; white-space: nowrap; }
  table.compare th { background: var(--accent-tint); color: var(--accent-ink); font-weight: 600; font-size: 12px; }
  table.compare td { border-top: 1px solid var(--line); }
  table.compare td.num, table.compare th.num { text-align: right; font-variant-numeric: tabular-nums; }
  table.compare tr.total td { border-top: 2px solid var(--line-strong); font-weight: 700; }
  table.compare td.name { white-space: normal; font-weight: 500; }
  .table-empty { margin-top: 2px; }

  /* ================= público-alvo blocks ================= */
  .form-groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; margin-top: 18px; }
  .gblock { border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; background: var(--bg); min-width: 0; }
  .gtitle { font-size: 13px; font-weight: 700; color: var(--accent-ink); margin-bottom: 12px; line-height: 1.35; }
  .gfields { display: grid; gap: 11px; }
  .group-blocks { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .group-rows { display: grid; gap: 6px; font-size: 12.5px; color: var(--quiet); line-height: 1.45; }
  .group-rows b { color: var(--ink); font-weight: 600; }
  .public-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .public-name { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
  .public-notes { font-size: 12.5px; color: var(--faint); max-width: 68ch; margin: 0; }
  .head-actions { display: flex; gap: 4px; }

  /* ================= analysis blocks ================= */
  .seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 999px; padding: 3px; background: var(--panel); }
  .seg button { font-family: inherit; font-size: 13px; font-weight: 600; color: var(--quiet); background: none; border: none; padding: 6px 16px; border-radius: 999px; cursor: pointer; }
  .seg button.on { background: var(--accent); color: #fff; }
  .an-axis { font-size: 12px; font-weight: 600; color: var(--faint); margin: 2px 0 -6px; grid-column: span 12; }
  .s4w { grid-column: span 4; }
  .an-card { border: 1px solid var(--line); border-radius: 16px; background: var(--panel); padding: 18px 20px; min-width: 0; height: 100%; }
  .an-card.tone-pos, .an-card.tone-neutral { border-top: 3px solid var(--accent); }
  .an-card.tone-neg { border-top: 3px solid var(--faint); }
  .an-card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .an-letter { width: 28px; height: 28px; border-radius: 50%; background: var(--accent-tint); color: var(--accent-ink); font-size: 13px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .an-title { font-size: 15px; font-weight: 700; }
  .an-sub { font-size: 11.5px; color: var(--faint); }
  .an-count { margin-left: auto; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
  ul.an-list { list-style: none; margin: 0; padding: 0; }
  ul.an-list li { display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; font-size: 13px; line-height: 1.5; padding: 8px 0; border-top: 1px solid var(--line); }
  ul.an-list li:first-child { border-top: none; }
  .an-x { background: none; border: none; color: var(--faint); font-size: 16px; line-height: 1; cursor: pointer; padding: 0 4px; flex: none; font-family: inherit; }
  .an-x:hover { color: var(--accent); }
  .an-add { display: flex; gap: 8px; margin-top: 10px; }
  .an-add input.f { flex: 1; min-width: 0; padding: 7px 10px; font-size: 13px; }
  .an-add .btn-ghost { padding: 7px 12px; font-size: 12.5px; white-space: nowrap; }

  .splash { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; color: var(--quiet); font-size: 14px; }
  .splash .brand-mark { width: 44px; height: 44px; font-size: 19px; }
  .splash p { margin: 0; max-width: 46ch; line-height: 1.5; }
  .splash .hint { font-size: 12.5px; color: var(--faint); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  .dropzone { border: 2px dashed var(--line-strong); text-align: center; padding: 24px 22px; transition: border-color .15s, background .15s; }
  .dropzone.over { border-color: var(--accent); background: var(--accent-tint); }
  .dz-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
  .dz-sub { margin: 0; font-size: 13px; color: var(--quiet); line-height: 1.6; }
  .dz-status { margin: 12px 0 0; font-size: 13px; color: var(--quiet); }
  .dz-status.err { color: var(--accent); font-weight: 600; }
  .dz-status.ok { color: var(--good); font-weight: 600; }
  .link-btn { background: none; border: none; padding: 0; font: inherit; font-weight: 600; color: var(--accent); text-decoration: underline; cursor: pointer; }
  .imp-note { margin: 0 0 14px; font-size: 13px; color: var(--quiet); line-height: 1.55; max-width: 74ch; }
  .imp-item { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; background: var(--bg); }
  .imp-head { display: flex; align-items: center; gap: 10px; cursor: pointer; flex-wrap: wrap; }
  .imp-head input { width: 16px; height: 16px; accent-color: var(--accent); }
  .imp-name { font-weight: 600; font-size: 14px; }
  .imp-count { margin-left: auto; font-size: 12px; color: var(--faint); }
  .imp-details { margin-top: 8px; font-size: 12.5px; }
  .imp-details summary { cursor: pointer; color: var(--accent-ink); font-weight: 600; }
  .imp-details .group-rows { margin-top: 8px; }
  .group-rows div { white-space: pre-line; }
  button[disabled] { opacity: .5; cursor: not-allowed; }
  .footnote { margin-top: 28px; font-size: 12px; color: var(--faint); line-height: 1.6; }

  /* ================= acessibilidade e feedback ================= */
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input.f:focus-visible, select.f:focus-visible, textarea.f:focus-visible { outline-offset: 0; }
  h1:focus { outline: none; }
  .skip { position: absolute; left: 12px; top: -56px; z-index: 100; background: var(--accent); color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; text-decoration: none; }
  .skip:focus { top: 12px; }
  .field-err { display: block; margin-top: 5px; font-size: 12px; font-weight: 600; color: var(--accent); }
  input.f[aria-invalid="true"], select.f[aria-invalid="true"], textarea.f[aria-invalid="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .hint-sm { display: block; margin-top: 5px; font-size: 11.5px; color: var(--faint); }
  .toast {
    position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60;
    display: none; align-items: center; gap: 14px; max-width: min(560px, calc(100vw - 32px)); padding: 10px 12px 10px 18px;
    background: var(--ink); color: var(--bg); border-radius: 12px; font-size: 13.5px; line-height: 1.4;
    box-shadow: 0 8px 28px rgba(20, 10, 40, .28);
  }
  .toast.show { display: flex; }
  .toast.warn { border-left: 4px solid #F5B942; }
  .toast button { background: none; border: none; color: inherit; font: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; padding: 10px 6px; white-space: nowrap; }
  .dropzone.compact { padding: 12px 18px; text-align: left; }
  .dropzone.compact .dz-title, .dropzone.compact .dz-sub { display: inline; margin: 0; }
  .dropzone.compact .dz-title { font-size: 13.5px; margin-right: 8px; }
  .mbar, .scrim, .drawer-close { display: none; }

  /* ================= responsive ================= */
  @media (max-width: 1200px) {
    .s4w { grid-column: span 6; }
    .main { padding: 30px 28px 80px; }
  }
  @media (max-width: 1100px) {
    .s7, .s5, .s8 { grid-column: span 12; }
  }
  @media (max-width: 980px) {
    .shell { grid-template-columns: minmax(0, 1fr); }
    .mbar {
      display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 30;
      padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line);
    }
    .mbar .brand-mark { width: 30px; height: 30px; font-size: 13px; }
    .mbar-title { font-weight: 800; font-size: 14.5px; letter-spacing: -0.01em; }
    .mbar-sync { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--quiet); padding-right: 4px; }
    .hamburger {
      width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; flex: none;
      background: none; border: 1px solid var(--line-strong); border-radius: 12px; color: var(--ink); cursor: pointer;
    }
    .hamburger:hover { background: var(--accent-tint); }
    .hamburger svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; }
    .side {
      position: fixed; top: 0; left: 0; bottom: 0; z-index: 50; width: min(300px, 86vw); height: 100vh; height: 100dvh;
      overflow-y: auto; transform: translateX(-102%); visibility: hidden;
      transition: transform .22s ease, visibility 0s linear .22s;

    var list = Array.isArray(data) ? data : (data && Array.isArray(data.publics) ? data.publics : (data && typeof data === "object" ? [data] : []));
    var skip = { id: 1, ord: 1, nome: 1, name: 1, titulo: 1, "título": 1, publico: 1, "público": 1 };
    var out = [];
    list.forEach(function (o, i) {
      if (!o || typeof o !== "object") return;
      var nome = String(o.nome || o.name || o.titulo || o["título"] || o.publico || o["público"] || "").trim();
      var pairs = [];
      Object.keys(o).forEach(function (k) { if (!skip[k] && o[k] != null && typeof o[k] !== "object") pairs.push([k, o[k]]); });
      var fields = mapPairs(pairs);
      if (!nome && !Object.keys(fields).length) return;
      out.push({ nome: nome || (fallbackName || "Público") + " " + (i + 1), fields: fields });
    });
    return out;
  }

  function parseCsvRows(text) {
    var first = (text.split(/\r?\n/)[0] || "");
    var delim = first.split(";").length > first.split(",").length ? ";" : ",";
    var rows = [], row = [], cell = "", q = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
      else if (c === '"') q = true;
      else if (c === delim) { row.push(cell); cell = ""; }
      else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
      else cell += c;
    }
    if (cell !== "" || row.length) { row.push(cell); rows.push(row); }

  }
  function parseCsvPublics(text, fallbackName) {
    var rows = parseCsvRows(String(text || "").replace(/^\uFEFF/, ""));

    var header = rows[0].map(norm);
    var vertical = ["criterio", "campo", "item"].indexOf(header[0]) >= 0 && ["preenchimento", "valor", "resposta"].indexOf(header[1]) >= 0;
    if (vertical) {
      var f = mapPairs(rows.slice(1).map(function (r) { return [r[0], r[1]]; }));
      var nm = f.nome; delete f.nome;
      return Object.keys(f).length ? [{ nome: fallbackName || "Público importado", fields: f }] : [];
    }
    var nameIdx = -1;
    header.forEach(function (h, i) { if (nameIdx < 0 && ["nome", "nome do publico", "publico", "publico alvo", "name"].indexOf(h) >= 0) nameIdx = i; });
    var out = [];
    rows.slice(1).forEach(function (r, ri) {
      var pairs = [];
      rows[0].forEach(function (h, i) { if (i !== nameIdx) pairs.push([h, r[i]]); });
      var fields = mapPairs(pairs);
      var nome = nameIdx >= 0 ? String(r[nameIdx] || "").trim() : "";

      out.push({ nome: nome || (fallbackName || "Público") + " " + (ri + 1), fields: fields });
    });

  }

  function loadScript(src) {

  var libPromises = {};

    } else {
      p = loadScript(MAMMOTH_URL);
    }
    libPromises[name] = p.catch(function () {
      libPromises[name] = null;
      throw userError("Não consegui carregar o leitor de " + (name === "pdf" ? "PDF" : "Word") + " (é preciso estar conectado à internet). Tente de novo ou use um arquivo TXT ou JSON.");
    });

  }
  function extractPdfText(buf) {
    return ensureLib("pdf").then(function () {
      return window.pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
    }).then(function (doc) {
      var out = [], chain = Promise.resolve();
      for (var p = 1; p <= doc.numPages; p++) {
        (function (n) {
          chain = chain.then(function () { return doc.getPage(n); }).then(function (page) { return page.getTextContent(); }).then(function (tc) {
            var line = "", lastY = null;
            tc.items.forEach(function (it) {
              if (typeof it.str !== "string") return;
              var y = it.transform ? it.transform[5] : null;
              if (lastY !== null && y !== null && Math.abs(y - lastY) > 2) { out.push(line); line = ""; }
              line += it.str;
              if (it.hasEOL) { out.push(line); line = ""; lastY = null; } else lastY = y;
            });
            if (line) out.push(line);
          });
        })(p);
      }
      return chain.then(function () { return out.join("\n"); });
    }).catch(function (err) {
      if (err && err.userMessage) throw err;
      throw userError("Não consegui ler esse PDF. Se ele for protegido ou escaneado (imagem), tente exportar como texto ou Word.");
    });
  }

  function readPublicsFromFile(file) {
    var name = file.name || "", ext = (name.split(".").pop() || "").toLowerCase(), fb = fallbackNameFrom(name);
    if (file.size > 10 * 1024 * 1024) return Promise.reject(userError("O arquivo passa de 10 MB."));
    if (ext === "json") return file.text().then(function (t) { return parseJsonPublics(t, fb); });
    if (ext === "csv") return file.text().then(function (t) { return parseCsvPublics(t, fb); });
    if (ext === "txt" || ext === "md") return file.text().then(function (t) { return parsePublicsFromText(t, fb); });
    if (ext === "pdf") {
      return file.arrayBuffer().then(extractPdfText).then(function (t) {
        if (!t.trim()) throw userError("Esse PDF não tem texto selecionável (parece ser uma imagem escaneada).");
        return parsePublicsFromText(t, fb);
      });
    }
    if (ext === "docx") {
      return file.arrayBuffer().then(function (buf) {
        return ensureLib("mammoth").then(function () { return window.mammoth.extractRawText({ arrayBuffer: buf }); });
      }).then(function (r) { return parsePublicsFromText(r.value, fb); }).catch(function (err) {
        if (err && err.userMessage) throw err;
        throw userError("Não consegui ler esse arquivo Word.");
      });
    }
    return Promise.reject(userError("Formato não suportado. Use PDF, Word (.docx), TXT, Markdown, JSON ou CSV."));
  }

  function handleFile(file) {

        render(); return;
      }
      var existing = state.publics.map(function (p) { return norm(p.nome); });
      ui.importPreview = {
        fileName: file.name,

  }

  // ---------------- sincronização ----------------
  function syncNoteHtml() {

  // avisos (fora do #app, para não sumirem quando a tela é redesenhada)
  var toastTimer = null, toastUndo = null;

    toastUndo = null; clearTimeout(toastTimer);

  function showToast(msg, opts) {

      + (opts.undo ? '<button type="button" data-toast-undo>Desfazer</button>' : '<button type="button" data-toast-close aria-label="Fechar aviso">×</button>');

  document.addEventListener("click", function (e) {

  function snapshotOf(st) {
    var s = { ideas: {}, publics: {}, swot: {}, pestel: {} };
    st.ideas.forEach(function (i) { s.ideas[i.id] = JSON.stringify(i); });
    st.publics.forEach(function (p) { s.publics[p.id] = JSON.stringify(p); });
    Object.keys(st.swot).forEach(function (g) { s.swot[g] = JSON.stringify(st.swot[g]); });
    Object.keys(st.pestel).forEach(function (g) { s.pestel[g] = JSON.stringify(st.pestel[g]); });

  }
  function diffSnapshots(prev, cur) {

        if (prev[sec][k] !== cur[sec][k]) {
          var listSec = (sec === "swot" || sec === "pestel");
          ops.push({ method: "PUT", path: sec + "/" + k, body: listSec ? JSON.stringify(cur[sec][k]) : cur[sec][k] });
        }

      Object.keys(prev[sec]).forEach(function (k) { if (!(k in cur[sec])) ops.push({ method: "DELETE", path: sec + "/" + k }); });
    });

  }
  function listFrom(obj) {

      return null;
    }).filter(Boolean).sort(function (a, b) { return (a.ord || 0) - (b.ord || 0); });
  }
  function groupsFrom(obj, defs, defaults) {
    if (!obj || typeof obj !== "object") return { groups: cloneLists(defaults), seeded: true };
    var out = {};
    defs.forEach(function (d) {
      var arr = [];
      try { arr = JSON.parse(obj[d.id]); } catch (e) {}

  }
  function applyRemote(data) {

    state = { ideas: listFrom(data.ideas), publics: listFrom(data.publics), swot: sw.groups, pestel: pe.groups };
    remoteSnap = snapshotOf(state);

  }

  function sendOp(op) {
    pendingWrites++; setNet("saving");

    if (op.body !== undefined) opts.body = op.body;
    fetch(DB + "/" + op.path + ".json", opts)
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); })
      .catch(function () { writeFailed = true; })

      });

  function refetch() {

      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (data) {

    es.addEventListener("patch", bump);

    es.onerror = function () { if (net.status === "online") setNet("offline"); };
  }

  // grava as mudanças: no banco da equipe (só o que mudou) ou no navegador (modo local)
  function persist() {

      render();
      return;
    }
    var cur = snapshotOf(state);
    var ops = diffSnapshots(remoteSnap, cur);
    remoteSnap = cur;
    render();
    ops.forEach(sendOp);
  }

  // ---------------- mutations ----------------
  // aceita 12000, 12.000, 12.000,50, 12,5 e US$ 12.000
  function parseMoney(v) {
    var t = String(v == null ? "" : v).replace(/US\$|\$|\s/gi, "");
    if (!t) return 0;
    if (!/^[\d.,]+$/.test(t)) return NaN;
    var lastDot = t.lastIndexOf("."), lastComma = t.lastIndexOf(",");
    if (lastDot >= 0 && lastComma >= 0) {
      t = lastComma > lastDot ? t.replace(/\./g, "").replace(",", ".") : t.replace(/,/g, "");
    } else if (lastComma >= 0) {
      if (t.split(",").length > 2) { if (!/^\d{1,3}(,\d{3})+$/.test(t)) return NaN; t = t.replace(/,/g, ""); }
      else t = t.replace(",", ".");
    } else if (lastDot >= 0 && /^\d{1,3}(\.\d{3})+$/.test(t)) {
      t = t.replace(/\./g, "");
    }
    if (!/^\d+(\.\d+)?$/.test(t)) return NaN;
    return parseFloat(t);
  }
  function parseCost(v) { var n = parseMoney(v); return isNaN(n) ? 0 : n; }
  function addIdea(d) {
    state.ideas.push({
      id: uid(), ord: Date.now(), name: d.name.trim(), category: d.category, publico: (d.publico || "").trim(),
      phase: d.phase, cost: parseCost(d.cost), status: d.status, notes: d.notes.trim()
    });
  }
  function updateIdea(id, d) {
    var it = byId(state.ideas, id);
    if (!it) return;
    it.name = d.name.trim(); it.category = d.category; it.publico = (d.publico || "").trim();
    it.phase = d.phase; it.cost = parseCost(d.cost); it.status = d.status; it.notes = d.notes.trim();
  }
  function removeIdea(id) { var it = byId(state.ideas, id); state.ideas = state.ideas.filter(function (i) { return i.id !== id; }); return it; }

  function addPublic(d) {
    var rec = { id: uid(), ord: Date.now(), nome: d.nome.trim() };

  function updatePublic(id, d) {

  }
  function removePublic(id) { var it = byId(state.publics, id); state.publics = state.publics.filter(function (p) { return p.id !== id; }); return it; }
  function restoreItem(listName, item) {
    if (!item || byId(state[listName], item.id)) return;

    state[listName].sort(function (a, b) { return (a.ord || 0) - (b.ord || 0); });
    persist();
  }

  function addAnalysisItem(kind, gid, text) {
    text = (text || "").trim();
    if (!text) return false;
    if (!Array.isArray(state[kind][gid])) state[kind][gid] = [];
    state[kind][gid].push(text);
    return true;
  }
  function removeAnalysisItem(kind, gid, idx) {
    var arr = state[kind][gid];
    if (!Array.isArray(arr) || idx < 0 || idx >= arr.length) return null;
    var text = arr[idx];
    arr.splice(idx, 1);
    return { kind: kind, gid: gid, idx: idx, text: text };
  }
  function restoreAnalysisItem(r) {
    if (!r || !Array.isArray(state[r.kind][r.gid])) return;
    var arr = state[r.kind][r.gid];
    arr.splice(Math.min(r.idx, arr.length), 0, r.text);

  }

  // ---------------- computed ----------------
  function totalsByCategory() {
    var m = {};
    CATEGORIES.forEach(function (c) { m[c.id] = 0; });
    state.ideas.forEach(function (i) { if (m.hasOwnProperty(i.category)) m[i.category] += (i.cost || 0); });
    return m;
  }
  function totalsByPhase() {
    var m = {};
    PHASES.forEach(function (p) { m[p.id] = { cost: 0, count: 0 }; });
    state.ideas.forEach(function (i) {
      if (m.hasOwnProperty(i.phase)) { m[i.phase].cost += (i.cost || 0); m[i.phase].count += 1; }
    });
    return m;
  }

  // ================= render: shell =================
  function render() {
    var app = document.getElementById("app");

      app.innerHTML = '<div class="splash"><div class="brand-mark">F</div><p>Carregando os dados da equipe…</p></div>';

        + '<button class="new-idea-toggle" data-action="retry">Tentar de novo</button></div>';
      var rb = app.querySelector("[data-action='retry']");
      if (rb) rb.addEventListener("click", function () { ui.loadError = false; ui.loading = true; setNet("loading"); render(); refetch(); });
      return;
    }
    var allocTotal = state.ideas.reduce(function (s, i) { return s + (i.cost || 0); }, 0);
    var view = byId(VIEWS, ui.view) ? ui.view : "geral";
    var meta = byId(VIEWS, view);
    var body;
    if (view === "ideias") body = viewIdeias();
    else if (view === "publicos") body = viewPublicos();
    else if (view === "analise") body = viewAnalise();
    else body = viewGeral(allocTotal);

    document.title = meta.title + " · Figo × UFC";
    document.body.classList.toggle("menu-open", !!ui.menuOpen);
    app.innerHTML = '<a class="skip" href="#conteudo">Pular para o conteúdo</a>'
      + '<div class="shell">' + renderMobileBar()
      + '<div class="scrim' + (ui.menuOpen ? " open" : "") + '" data-action="menu-close"></div>'
      + renderSide(allocTotal)
      + '<main class="main" id="conteudo" tabindex="-1"' + (ui.menuOpen ? " inert" : "") + '>' + renderTopbar(meta, view) + body + '</main></div>';
    bindEvents();
    if (ui.focusAfter) {
      var fel = app.querySelector(ui.focusAfter);
      ui.focusAfter = null;
      if (fel) fel.focus();
    }
  }

  function renderMobileBar() {
    return '<header class="mbar"' + (ui.menuOpen ? " inert" : "") + '>'
      + '<button class="hamburger" data-action="menu-toggle" aria-label="Abrir menu de navegação" aria-expanded="' + (ui.menuOpen ? "true" : "false") + '" aria-controls="app-menu">'
      + '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5.5h14M3 10h14M3 14.5h14"/></svg></button>'
      + '<div class="brand-mark" aria-hidden="true">F</div><span class="mbar-title">Figo × UFC</span>'
      + '<span class="mbar-sync">' + syncShortHtml() + '</span></header>';
  }

  function renderSide(allocTotal) {
    var pct = Math.min(allocTotal / TOTAL_BUDGET * 100, 100);
    var nav = VIEWS.map(function (v) {
      var badge = v.id === "ideias" ? state.ideas.length : (v.id === "publicos" ? state.publics.length : null);
      var active = ui.view === v.id;
      return '<button class="' + (active ? "on" : "") + '" data-action="nav" data-view="' + v.id + '"' + (active ? ' aria-current="page"' : '') + '>'
        + '<svg viewBox="0 0 16 16" aria-hidden="true">' + v.icon + '</svg><span>' + esc(v.label) + '</span>'
        + (badge !== null ? '<span class="badge">' + badge + '</span>' : '') + '</button>';
    }).join("");
    return '<aside class="side' + (ui.menuOpen ? " open" : "") + '" id="app-menu" aria-label="Menu">'
      + '<div class="brand"><div class="brand-mark">F</div><div><div class="brand-name">Figo × UFC</div><div class="brand-sub">A3 Branding</div></div>'
      + '<button class="drawer-close" data-action="menu-close" aria-label="Fechar menu">×</button></div>'
      + '<nav class="nav" aria-label="Navegação principal">' + nav + '</nav>'
      + '<div class="side-foot">'
      + '<div class="mini-label"><span>Orçamento alocado</span><b>' + Math.round(pct) + '%</b></div>'
      + '<div class="mini-track"><div class="mini-fill" style="width:' + pct.toFixed(1) + '%"></div></div>'
      + '<div class="mini-label" style="margin-top:7px;"><span>' + fmtMoney(allocTotal) + '</span><span>' + fmtMoney(TOTAL_BUDGET) + '</span></div>'
      + '<div class="sync-note">' + syncNoteHtml() + '</div>'
      + '<button class="btn-ghost" data-action="export" style="margin-top:12px;width:100%;font-size:12px;">Baixar backup (JSON)</button>'
      + '</div></aside>';
  }

  function renderTopbar(meta, view) {
    var actions = "";
    if (view === "ideias" && !ui.formOpen) actions = '<button class="new-idea-toggle" data-action="open-form"><span class="plus">+</span> Nova ideia</button>';
    if (view === "publicos" && !ui.publicFormOpen) actions = '<button class="new-idea-toggle" data-action="open-public-form"><span class="plus">+</span> Novo público-alvo</button>';
    if (view === "analise") {
      var kind = ui.analiseTab === "pestel" ? "pestel" : "swot";
      actions = '<div class="seg" role="tablist" aria-label="Tipo de análise">'
        + '<button role="tab" aria-selected="' + (kind === "swot") + '" class="' + (kind === "swot" ? "on" : "") + '" data-action="an-tab" data-tab="swot">SWOT</button>'
        + '<button role="tab" aria-selected="' + (kind === "pestel") + '" class="' + (kind === "pestel" ? "on" : "") + '" data-action="an-tab" data-tab="pestel">PESTEL</button></div>'
        + '<button class="btn-ghost" data-action="an-edit-toggle">' + (ui.analiseEdit ? "Concluir edição" : "Editar itens") + '</button>';
    }
    return '<header class="topbar"><div><p class="kicker">Figo × UFC · A3 Branding</p><h1 tabindex="-1">' + esc(meta.title) + '</h1><p class="sub">' + esc(meta.sub) + '</p></div>'
      + '<div class="top-actions">' + actions + '</div></header>';
  }

  // ================= view: visão geral =================
  function statCard(label, value, sub, cls, extra) {
    return '<div class="card stat s4"><p class="score-label">' + esc(label) + '</p>'
      + '<p class="score-value' + (cls ? " " + cls : "") + '">' + value + '</p>'
      + (sub ? '<p class="score-sub">' + esc(sub) + '</p>' : '') + (extra || "") + '</div>';
  }

  function viewGeral(allocTotal) {
    var alloc = totalsByCategory();
    var byPhase = totalsByPhase();
    var remaining = ALLOCABLE - allocTotal;
    var pct = Math.min(allocTotal / TOTAL_BUDGET * 100, 100);
    var maxPhaseCost = Math.max.apply(null, PHASES.map(function (p) { return byPhase[p.id].cost; }).concat([1]));

    var html = '<div class="grid">';
    html += statCard("Orçamento total", fmtMoney(TOTAL_BUDGET), "orçamento fictício da A3", "");
    html += statCard("Alocado a ideias", fmtMoney(allocTotal), state.ideas.length ? Math.round(allocTotal / ALLOCABLE * 100) + "% do orçamento" : "nenhuma ideia ainda",
      remaining < 0 ? "accent" : "", '<div class="mini-track"><div class="mini-fill" style="width:' + pct.toFixed(1) + '%"></div></div>');
    html += statCard("Disponível", remaining < 0 ? fmtMoney(0) : fmtMoney(remaining), remaining < 0 ? "estourado em " + fmtMoney(Math.abs(remaining)) : "ainda sem destino", remaining < 0 ? "accent" : "good");

    // orçamento por categoria
    html += '<section class="card s7"><div class="card-head"><h2>Orçamento por categoria</h2><span class="hint">traço = meta da categoria</span></div>';
    CATEGORIES.forEach(function (cat) {
      var target = Math.round(TOTAL_BUDGET * cat.pct / 100);
      var spent = alloc[cat.id];
      var w = Math.min(spent / TOTAL_BUDGET * 100, 100);
      var tp = Math.min(target / TOTAL_BUDGET * 100, 100);
      var over = spent > target;
      html += '<div class="bar-row"><div class="bar-top"><span class="bar-name">' + esc(cat.label) + '</span>'
        + '<span class="bar-figs"><b>' + fmtMoney(spent) + '</b> / meta ' + fmtMoney(target) + '</span></div>'
        + '<div class="bar-track"><div class="bar-fill' + (over ? "" : " under-target") + '" style="width:' + w.toFixed(1) + '%"></div>'
        + '<div class="bar-target" style="left:' + tp.toFixed(1) + '%"></div></div></div>';
    });
    html += '<div class="legend"><span><i style="background:var(--accent)"></i>acima ou na meta</span><span><i style="background:var(--faint)"></i>abaixo da meta</span></div></section>';

    // tempo por fase
    html += '<section class="card s5"><div class="card-head"><h2>Tempo — carga por fase</h2><span class="hint">custo por fase da implementação</span></div>';
    PHASES.forEach(function (ph) {
      var d = byPhase[ph.id];
      var w = d.cost > 0 ? Math.max(d.cost / maxPhaseCost * 100, 4) : 0;
      html += '<div class="bar-row"><div class="bar-top"><span class="bar-name">' + esc(ph.label) + '</span>'
        + '<span class="bar-figs"><b>' + fmtMoney(d.cost) + '</b> · ' + d.count + (d.count === 1 ? " ideia" : " ideias") + '</span></div>'
        + '<div class="bar-track"><div class="bar-fill" style="width:' + w.toFixed(1) + '%"></div></div></div>';
    });
    html += '</section>';

    // comparativo
    html += renderCompareCard(allocTotal);
    html += '</div>';
    html += '<p class="footnote">Meta de cada categoria calculada sobre o orçamento total de US$ ' + TOTAL_BUDGET.toLocaleString("pt-BR") + ' fictícios da A3.</p>';
    return html;
  }

  function renderCompareCard(allocTotal) {
    var rows = state.ideas.slice().sort(function (a, b) { return (b.cost || 0) - (a.cost || 0); });
    var html = '<section class="card s12"><div class="card-head"><h2>Comparativo de gastos por campanha</h2><span class="hint">do maior para o menor custo</span></div>';
    if (!rows.length) {
      return html + '<div class="empty table-empty">Cadastre ideias para ver o comparativo de gastos aqui.</div></section>';
    }
    html += '<div class="table-scroll"><table class="compare"><thead><tr>'
      + '<th>Campanha</th><th>Categoria</th><th>Fase</th><th>Público</th><th class="num">Custo</th><th class="num">% do orçamento</th>'
      + '</tr></thead><tbody>';
    rows.forEach(function (it) {
      var cat = byId(CATEGORIES, it.category), ph = byId(PHASES, it.phase);
      var pct = TOTAL_BUDGET > 0 ? (it.cost || 0) / TOTAL_BUDGET * 100 : 0;
      html += '<tr><td class="name">' + esc(it.name || "Sem nome") + '</td><td>' + esc(cat ? cat.label : "—") + '</td>'
        + '<td>' + esc(ph ? ph.label : "—") + '</td><td>' + esc(it.publico || "—") + '</td>'
        + '<td class="num">' + fmtMoney(it.cost) + '</td><td class="num">' + pct.toFixed(1) + '%</td></tr>';
    });
    var totalPct = TOTAL_BUDGET > 0 ? allocTotal / TOTAL_BUDGET * 100 : 0;
    html += '<tr class="total"><td>Total</td><td></td><td></td><td></td><td class="num">' + fmtMoney(allocTotal) + '</td><td class="num">' + totalPct.toFixed(1) + '%</td></tr>';
    return html + '</tbody></table></div></section>';
  }

  // ================= view: ideias =================
  function viewIdeias() {
    var html = '<div class="grid">';
    if (ui.formOpen) html += '<div class="s12">' + renderIdeaForm() + '</div>';

    var phaseOptions = '<option value="all">Todas as fases</option>' + PHASES.map(function (p) {
      return '<option value="' + p.id + '"' + (ui.filterPhase === p.id ? " selected" : "") + '>' + esc(p.label) + '</option>';
    }).join("");
    var catOptions = '<option value="all">Todas as categorias</option>' + CATEGORIES.map(function (c) {
      return '<option value="' + c.id + '"' + (ui.filterCategory === c.id ? " selected" : "") + '>' + esc(c.label) + '</option>';
    }).join("");

    var filtered = state.ideas.filter(function (i) {
      if (ui.filterPhase !== "all" && i.phase !== ui.filterPhase) return false;
      if (ui.filterCategory !== "all" && i.category !== ui.filterCategory) return false;
      return true;
    });

    html += '<section class="card s12"><div class="card-head"><h2>Ideias cadastradas <span class="hint">· ' + state.ideas.length + (state.ideas.length === 1 ? " ideia" : " ideias") + '</span></h2>'
      + '<div class="filters"><select class="filter" data-role="filter-phase">' + phaseOptions + '</select>'
      + '<select class="filter" data-role="filter-category">' + catOptions + '</select></div></div>';
    if (!filtered.length) {
      html += '<div class="empty">' + (state.ideas.length ? "Nenhuma ideia bate com esse filtro." : "Nenhuma ideia cadastrada ainda. Comece pela primeira.") + '</div>';
    } else {
      html += '<div class="cards-grid">' + filtered.map(renderIdeaCard).join("") + '</div>';
    }
    return html + '</section></div>';
  }

  function renderIdeaCard(it) {
    var cat = byId(CATEGORIES, it.category), ph = byId(PHASES, it.phase);
    var st = byId(STATUSES, it.status) || STATUSES[0];
    var nm = esc(it.name || "sem nome");
    return '<article class="idea-card">'
      + '<div class="ic-top"><span class="tag ' + st.cls + '">' + esc(st.label) + '</span><span class="ic-cost">' + fmtMoney(it.cost) + '</span></div>'
      + '<div class="ic-name">' + esc(it.name || "Sem nome") + '</div>'
      + '<div class="ic-meta">' + esc(cat ? cat.label : "—") + '<span class="dot">·</span>' + esc(ph ? ph.label : "—")
      + (it.publico ? '<span class="dot">·</span>' + esc(it.publico) : '') + '</div>'
      + (it.notes ? '<div class="ic-notes">' + esc(it.notes) + '</div>' : '')
      + '<div class="ic-actions"><button class="icon-btn" data-action="edit" data-id="' + it.id + '" aria-label="Editar ideia ' + nm + '">Editar</button>'
      + '<button class="icon-btn danger" data-action="delete" data-id="' + it.id + '" aria-label="Excluir ideia ' + nm + '">Excluir</button>'
      + '</div></article>';
  }

  function errHtml(errs, key) {
    return errs && errs[key] ? '<span class="field-err" role="alert">' + esc(errs[key]) + '</span>' : "";
  }
  function invalidAttr(errs, key) { return errs && errs[key] ? ' aria-invalid="true"' : ""; }

  function renderIdeaForm() {
    var d = ui.draft || emptyDraft();
    var isEdit = !!ui.editingId;
    var catOpts = CATEGORIES.map(function (c) { return '<option value="' + c.id + '"' + (d.category === c.id ? " selected" : "") + '>' + esc(c.label) + '</option>'; }).join("");
    var phOpts = PHASES.map(function (p) { return '<option value="' + p.id + '"' + (d.phase === p.id ? " selected" : "") + '>' + esc(p.label) + '</option>'; }).join("");
    var stOpts = STATUSES.map(function (s) { return '<option value="' + s.id + '"' + (d.status === s.id ? " selected" : "") + '>' + esc(s.label) + '</option>'; }).join("");
    var publicField = state.publics.length
      ? '<select class="f" data-field="publico"><option value="">Selecione…</option>' + state.publics.map(function (p) {
          return '<option value="' + esc(p.nome) + '"' + (d.publico === p.nome ? " selected" : "") + '>' + esc(p.nome) + '</option>';
        }).join("") + '</select>'
      : '<input class="f" data-field="publico" value="' + esc(d.publico) + '" placeholder="Cadastre um público-alvo primeiro, ou digite aqui">';

    return '<div class="card idea-form"><h3>' + (isEdit ? "Editar ideia" : "Nova ideia") + '</h3>'
      + '<div class="field-grid cols3">'
      + '<label class="field full"><span class="lbl">Nome da ideia (obrigatório)</span><input class="f" data-field="name" aria-required="true"' + invalidAttr(ui.formErrors, "name") + ' value="' + esc(d.name) + '" placeholder="Ex.: série de conteúdo com atletas de base">' + errHtml(ui.formErrors, "name") + '</label>'
      + '<label class="field"><span class="lbl">Categoria de orçamento</span><select class="f" data-field="category">' + catOpts + '</select></label>'
      + '<label class="field"><span class="lbl">Fase de implementação</span><select class="f" data-field="phase">' + phOpts + '</select></label>'
      + '<label class="field"><span class="lbl">Status</span><select class="f" data-field="status">' + stOpts + '</select></label>'
      + '<label class="field"><span class="lbl">Público</span>' + publicField + '</label>'
      + '<label class="field"><span class="lbl">Custo estimado (US$)</span><input class="f" data-field="cost" inputmode="decimal"' + invalidAttr(ui.formErrors, "cost") + ' value="' + esc(d.cost) + '" placeholder="Ex.: 12000">' + errHtml(ui.formErrors, "cost") + '<span class="hint-sm">Aceita 12000, 12.000 ou 12.000,50</span></label>'
      + '<label class="field full"><span class="lbl">Notas</span><textarea class="f" data-field="notes" placeholder="Contexto, dependências, referência...">' + esc(d.notes) + '</textarea></label>'
      + '</div><div class="form-actions"><button class="btn-primary" data-action="save-form">' + (isEdit ? "Salvar alterações" : "Adicionar ideia") + '</button>'
      + '<button class="btn-ghost" data-action="close-form">Cancelar</button></div></div>';
  }

  // ================= view: públicos =================
  function viewPublicos() {
    var html = '<div class="grid">';
    html += renderImportCard();
    if (ui.publicFormOpen) html += '<div class="s12">' + renderPublicForm() + '</div>';
    if (!state.publics.length) {
      if (!ui.publicFormOpen) html += '<div class="s12"><div class="empty">Nenhum público-alvo cadastrado ainda. Use o botão acima para registrar o primeiro.</div></div>';
    } else {
      state.publics.forEach(function (p) { html += '<section class="card s12">' + renderPublicCard(p) + '</section>'; });
    }
    return html + '</div>';
  }

  function renderPublicForm() {
    var d = ui.publicDraft || emptyPublicDraft();
    var isEdit = !!ui.editingPublicId;
    var groups = PUBLIC_FIELD_GROUPS.map(function (g) {
      var fields = g.fields.map(function (f) {
        if (f[2] === "area") {
          return '<label class="field"><span class="lbl">' + esc(f[1]) + '</span><textarea class="f" rows="4" data-pfield="' + f[0] + '">' + esc(d[f[0]] || "") + '</textarea></label>';
        }
        return '<label class="field"><span class="lbl">' + esc(f[1]) + '</span><input class="f" data-pfield="' + f[0] + '" value="' + esc(d[f[0]] || "") + '"></label>';
      }).join("");
      return '<div class="gblock"><div class="gtitle">' + esc(g.label) + '</div><div class="gfields">' + fields + '</div></div>';
    }).join("");
    return '<div class="card idea-form"><h3>' + (isEdit ? "Editar público-alvo" : "Novo público-alvo") + '</h3>'
      + '<div class="field-grid"><label class="field full"><span class="lbl">Nome do público (obrigatório)</span><input class="f" data-pfield="nome" aria-required="true"' + invalidAttr(ui.publicErrors, "nome") + ' value="' + esc(d.nome) + '" placeholder="Ex.: fãs recentes do UFC no Brasil">' + errHtml(ui.publicErrors, "nome") + '</label></div>'
      + '<div class="form-groups">' + groups + '</div>'
      + '<div class="form-actions"><button class="btn-primary" data-action="save-public-form">' + (isEdit ? "Salvar alterações" : "Adicionar público") + '</button>'
      + '<button class="btn-ghost" data-action="close-public-form">Cancelar</button></div></div>';
  }

  function renderPublicCard(p) {
    var anyFilled = PUBLIC_FIELD_KEYS.some(function (k) { return p[k]; });
    var nm = esc(p.nome || "sem nome");
    var blocks = PUBLIC_FIELD_GROUPS.map(function (g) {
      var rows = g.fields.filter(function (f) { return p[f[0]]; });
      if (!rows.length) return "";
      return '<div class="gblock"><div class="gtitle">' + esc(g.label) + '</div><div class="group-rows">'
        + rows.map(function (f) { return '<div><b>' + esc(f[1]) + ':</b> ' + esc(p[f[0]]) + '</div>'; }).join("") + '</div></div>';
    }).join("");
    return '<div class="public-head"><span class="public-name">' + esc(p.nome || "Sem nome") + '</span><div class="head-actions">'
      + '<button class="icon-btn" data-action="edit-public" data-id="' + p.id + '" aria-label="Editar público ' + nm + '">Editar</button>'
      + '<button class="icon-btn danger" data-action="delete-public" data-id="' + p.id + '" aria-label="Excluir público ' + nm + '">Excluir</button>'
      + '</div></div>'
      + (anyFilled ? '<div class="group-blocks">' + blocks + '</div>' : '<p class="public-notes">Nenhum critério preenchido ainda — clique em editar para completar.</p>');
  }

  function renderImportCard() {
    var pv = ui.importPreview, st = ui.importState;
    if (pv) {
      var n = pv.items.filter(function (i) { return i.checked; }).length;
      var items = pv.items.map(function (it, idx) {
        var keys = Object.keys(it.fields);
        var rows = keys.map(function (k) { return '<div><b>' + esc(FIELD_LABEL[k] || k) + ':</b> ' + esc(shorten(it.fields[k], 160)) + '</div>'; }).join("");
        return '<div class="imp-item"><label class="imp-head"><input type="checkbox" data-import-check="' + idx + '"' + (it.checked ? " checked" : "") + '>'
          + '<span class="imp-name">' + esc(it.nome) + '</span>'
          + (it.dup ? '<span class="tag status-validacao">já existe um público com esse nome</span>' : '')
          + '<span class="imp-count">' + keys.length + (keys.length === 1 ? " campo" : " campos") + '</span></label>'
          + '<details class="imp-details"><summary>Ver o que foi reconhecido</summary><div class="group-rows">' + rows + '</div></details></div>';
      }).join("");
      return '<div class="s12"><div class="card idea-form"><h3>Importar de “' + esc(pv.fileName) + '”</h3>'
        + '<p class="imp-note">Encontrei ' + pv.items.length + (pv.items.length === 1 ? " público" : " públicos")
        + '. Marque os que quer importar; depois você pode editar cada um. Os campos são reconhecidos pelos títulos do texto (Faixa etária, Interesses, Oportunidade…); o que não tem campo correspondente vai para “Outras informações”.</p>'
        + items
        + '<div class="form-actions"><button class="btn-primary" data-action="import-confirm"' + (n ? "" : " disabled") + '>Importar ' + n + (n === 1 ? " selecionado" : " selecionados") + '</button>'
        + '<button class="btn-ghost" data-action="import-cancel">Cancelar</button></div></div></div>';
    }
    var msg = "";
    if (st && st.status === "reading") msg = '<p class="dz-status">Lendo “' + esc(st.fileName) + '”…</p>';
    else if (st && st.status === "error") msg = '<p class="dz-status err">' + esc(st.message) + '</p>';
    else if (ui.importMsg) msg = '<p class="dz-status ok">' + esc(ui.importMsg) + '</p>';
    return '<section class="card s12 dropzone' + (state.publics.length ? " compact" : "") + '" data-role="dropzone"><div class="dz-title">Importar públicos-alvo de um arquivo</div>'
      + '<p class="dz-sub">Arraste um arquivo para cá ou <button class="link-btn" data-action="pick-file">escolha no computador</button>. Aceita PDF, Word (.docx), TXT, Markdown, JSON e CSV.</p>'
      + '<input type="file" id="file-input" accept=".pdf,.docx,.txt,.md,.json,.csv" hidden>' + msg + '</section>';
  }

  // ================= view: análise =================
  function analysisCard(kind, def) {
    var items = state[kind][def.id] || [];
    var h = '<div class="an-card tone-' + def.tone + '"><div class="an-card-head">'
      + (def.letter ? '<span class="an-letter">' + def.letter + '</span>' : '')
      + '<div><div class="an-title">' + esc(def.label) + '</div>' + (def.sub ? '<div class="an-sub">' + esc(def.sub) + '</div>' : '') + '</div>'
      + '<span class="an-count">' + items.length + '</span></div>';
    h += '<ul class="an-list">' + items.map(function (t, i) {
      return '<li><span>' + esc(t) + '</span>'
        + (ui.analiseEdit ? '<button class="an-x" title="Remover" aria-label="Remover item" data-action="an-remove" data-kind="' + kind + '" data-group="' + def.id + '" data-idx="' + i + '">×</button>' : '')
        + '</li>';
    }).join("") + '</ul>';
    if (ui.analiseEdit) {
      h += '<div class="an-add"><input class="f" data-an-input="' + kind + ':' + def.id + '" placeholder="Novo item…">'
        + '<button class="btn-ghost" data-action="an-add" data-kind="' + kind + '" data-group="' + def.id + '">Adicionar</button></div>';
    }
    return h + '</div>';
  }

  function viewAnalise() {
    var kind = ui.analiseTab === "pestel" ? "pestel" : "swot";
    var html = '<div class="grid">';
    if (kind === "swot") {
      html += '<div class="an-axis">Fatores internos</div>'
        + '<div class="s6">' + analysisCard("swot", SWOT_DEFS[0]) + '</div><div class="s6">' + analysisCard("swot", SWOT_DEFS[1]) + '</div>'
        + '<div class="an-axis">Fatores externos</div>'
        + '<div class="s6">' + analysisCard("swot", SWOT_DEFS[2]) + '</div><div class="s6">' + analysisCard("swot", SWOT_DEFS[3]) + '</div>';
    } else {
      html += PESTEL_DEFS.map(function (d) { return '<div class="s4w">' + analysisCard("pestel", d) + '</div>'; }).join("");
    }
    return html + '</div>';
  }

  function clearFieldError(errs, key, el) {
    if (!errs || !errs[key]) return;
    delete errs[key];
    el.removeAttribute("aria-invalid");
    var er = el.parentNode && el.parentNode.querySelector(".field-err");
    if (er) er.remove();
  }
  function submitIdeaForm() {
    var d = ui.draft || emptyDraft(), errs = {};
    if (!d.name || !d.name.trim()) errs.name = "Dê um nome para a ideia.";
    if (String(d.cost || "").trim() && isNaN(parseMoney(d.cost))) errs.cost = "Use só números, por exemplo 12000 ou 12.000,50.";
    if (Object.keys(errs).length) {
      ui.formErrors = errs;
      ui.focusAfter = errs.name ? "[data-field='name']" : "[data-field='cost']";
      render();
      return;
    }
    var wasEdit = !!ui.editingId;
    if (wasEdit) updateIdea(ui.editingId, d); else addIdea(d);
    ui.formOpen = false; ui.editingId = null; ui.draft = null; ui.formErrors = {};
    var over = state.ideas.reduce(function (sum, i) { return sum + (i.cost || 0); }, 0) - ALLOCABLE;
    persist();
    showToast((wasEdit ? "Ideia atualizada." : "Ideia adicionada.") + (over > 0 ? " Atenção: o total alocado passou do orçamento em " + fmtMoney(over) + "." : ""), { warn: over > 0 });
  }
  function submitPublicForm() {
    var d = ui.publicDraft || emptyPublicDraft();
    var nome = (d.nome || "").trim();
    if (!nome) { ui.publicErrors = { nome: "Dê um nome para o público." }; }
    else if (state.publics.some(function (p) { return p.id !== ui.editingPublicId && norm(p.nome) === norm(nome); })) {
      ui.publicErrors = { nome: "Já existe um público com esse nome. Use outro nome ou edite o existente." };
    }
    if (ui.publicErrors.nome) { ui.focusAfter = "[data-pfield='nome']"; render(); return; }
    var wasEdit = !!ui.editingPublicId;
    if (wasEdit) updatePublic(ui.editingPublicId, d); else addPublic(d);
    ui.publicFormOpen = false; ui.editingPublicId = null; ui.publicDraft = null; ui.publicErrors = {};
    persist();
    showToast(wasEdit ? "Público atualizado." : "Público adicionado.");
  }

  // ================= events =================
  function bindEvents() {
    var app = document.getElementById("app");
    function on(sel, fn) { app.querySelectorAll(sel).forEach(function (el) { el.addEventListener("click", function (ev) { fn(el, ev); }); }); }

    on("[data-action='nav']", function (el) {
      ui.view = el.getAttribute("data-view");
      ui.importMsg = ""; ui.menuOpen = false; ui.focusAfter = "h1";
      render();
      window.scrollTo(0, 0);
    });
    on("[data-action='menu-toggle']", function () {
      ui.menuOpen = !ui.menuOpen;
      ui.focusAfter = ui.menuOpen ? ".side .nav button.on" : "[data-action='menu-toggle']";
      render();
    });
    on("[data-action='menu-close']", function () {
      if (!ui.menuOpen) return;
      ui.menuOpen = false; ui.focusAfter = "[data-action='menu-toggle']";
      render();
    });

    on("[data-action='export']", function () {
      var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "figo-ufc-backup.json";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    });

    // ideias
    on("[data-action='open-form']", function () { ui.formOpen = true; ui.editingId = null; ui.draft = emptyDraft(); ui.formErrors = {}; ui.focusAfter = "[data-field='name']"; render(); });
    on("[data-action='close-form']", function () { ui.formOpen = false; ui.editingId = null; ui.draft = null; ui.formErrors = {}; render(); });
    on("[data-action='edit']", function (el) {
      var it = byId(state.ideas, el.getAttribute("data-id"));
      if (!it) return;
      ui.editingId = it.id;
      ui.draft = { name: it.name, category: it.category, publico: it.publico, phase: it.phase, cost: String(it.cost || ""), status: it.status, notes: it.notes };
      ui.formOpen = true; ui.formErrors = {}; ui.focusAfter = "[data-field='name']";
      render();
    });
    on("[data-action='delete']", function (el) {
      var removed = removeIdea(el.getAttribute("data-id"));
      persist();
      if (removed) showToast("Ideia excluída.", { undo: function () { restoreItem("ideas", removed); showToast("Ideia restaurada."); } });
    });
    app.querySelectorAll("[data-field]").forEach(function (el) {
      el.addEventListener("input", function () {
        var key = el.getAttribute("data-field");
        if (!ui.draft) ui.draft = emptyDraft();
        ui.draft[key] = el.value;
        clearFieldError(ui.formErrors, key, el);
      });
    });
    app.querySelectorAll("input[data-field]").forEach(function (el) {
      el.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); submitIdeaForm(); } });
    });
    on("[data-action='save-form']", function () { submitIdeaForm(); });
    var fp = app.querySelector("[data-role='filter-phase']");
    if (fp) fp.addEventListener("change", function () { ui.filterPhase = fp.value; render(); });
    var fc = app.querySelector("[data-role='filter-category']");
    if (fc) fc.addEventListener("change", function () { ui.filterCategory = fc.value; render(); });

    // públicos-alvo
    on("[data-action='open-public-form']", function () { ui.publicFormOpen = true; ui.editingPublicId = null; ui.publicDraft = emptyPublicDraft(); ui.publicErrors = {}; ui.focusAfter = "[data-pfield='nome']"; render(); });
    on("[data-action='close-public-form']", function () { ui.publicFormOpen = false; ui.editingPublicId = null; ui.publicDraft = null; ui.publicErrors = {}; render(); });
    on("[data-action='edit-public']", function (el) {
      var it = byId(state.publics, el.getAttribute("data-id"));
      if (!it) return;
      ui.editingPublicId = it.id;
      var d = { nome: it.nome };
      PUBLIC_FIELD_KEYS.forEach(function (k) { d[k] = it[k] || ""; });
      ui.publicDraft = d; ui.publicFormOpen = true; ui.publicErrors = {}; ui.focusAfter = "[data-pfield='nome']";
      render();
    });
    on("[data-action='delete-public']", function (el) {
      var removed = removePublic(el.getAttribute("data-id"));
      persist();
      if (removed) showToast("Público excluído.", { undo: function () { restoreItem("publics", removed); showToast("Público restaurado."); } });
    });
    app.querySelectorAll("[data-pfield]").forEach(function (el) {
      el.addEventListener("input", function () {
        var key = el.getAttribute("data-pfield");
        if (!ui.publicDraft) ui.publicDraft = emptyPublicDraft();
        ui.publicDraft[key] = el.value;
        clearFieldError(ui.publicErrors, key, el);
      });
    });
    app.querySelectorAll("input[data-pfield]").forEach(function (el) {
      el.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); submitPublicForm(); } });
    });
    on("[data-action='save-public-form']", function () { submitPublicForm(); });

    // importação por arquivo
    var fi = app.querySelector("#file-input");
    if (fi) fi.addEventListener("change", function () { var f = fi.files && fi.files[0]; fi.value = ""; handleFile(f); });
    on("[data-action='pick-file']", function () { var i = app.querySelector("#file-input"); if (i) i.click(); });
    var dz = app.querySelector("[data-role='dropzone']");
    if (dz) {
      ["dragenter", "dragover"].forEach(function (t) { dz.addEventListener(t, function (e) { e.preventDefault(); dz.classList.add("over"); }); });
      ["dragleave", "drop"].forEach(function (t) { dz.addEventListener(t, function (e) { e.preventDefault(); dz.classList.remove("over"); }); });
      dz.addEventListener("drop", function (e) { handleFile(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]); });
    }
    app.querySelectorAll("[data-import-check]").forEach(function (el) {
      el.addEventListener("change", function () {
        var it = ui.importPreview && ui.importPreview.items[parseInt(el.getAttribute("data-import-check"), 10)];
        if (it) { it.checked = el.checked; render(); }
      });
    });
    on("[data-action='import-cancel']", function () { ui.importPreview = null; render(); });
    on("[data-action='import-confirm']", function () {
      var pv = ui.importPreview;
      if (!pv) return;
      var added = 0;
      pv.items.forEach(function (it) {
        if (!it.checked) return;
        var d = emptyPublicDraft();
        d.nome = it.nome;
        Object.keys(it.fields).forEach(function (k) { if (k in d) d[k] = it.fields[k]; });
        addPublic(d); added++;
      });
      ui.importPreview = null;
      ui.importMsg = added + (added === 1 ? " público importado." : " públicos importados.");
      persist();
      showToast(ui.importMsg);
    });

    // análise
    on("[data-action='an-tab']", function (el) { ui.analiseTab = el.getAttribute("data-tab"); render(); });
    on("[data-action='an-edit-toggle']", function () { ui.analiseEdit = !ui.analiseEdit; render(); });
    on("[data-action='an-remove']", function (el) {
      var r = removeAnalysisItem(el.getAttribute("data-kind"), el.getAttribute("data-group"), parseInt(el.getAttribute("data-idx"), 10));
      persist();
      if (r) showToast("Item removido.", { undo: function () { restoreAnalysisItem(r); showToast("Item restaurado."); } });
    });
    function submitAnalysisAdd(kind, gid) {
      var input = app.querySelector("[data-an-input='" + kind + ":" + gid + "']");
      if (!input) return;
      if (!input.value.trim()) { input.setAttribute("aria-invalid", "true"); input.focus(); return; }
      if (addAnalysisItem(kind, gid, input.value)) {
        ui.focusAfter = "[data-an-input='" + kind + ":" + gid + "']";
        persist();
        showToast("Item adicionado.");
      }
    }
    on("[data-action='an-add']", function (el) { submitAnalysisAdd(el.getAttribute("data-kind"), el.getAttribute("data-group")); });
    app.querySelectorAll("[data-an-input]").forEach(function (el) {
      el.addEventListener("input", function () { el.removeAttribute("aria-invalid"); });
      el.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter") { var parts = el.getAttribute("data-an-input").split(":"); submitAnalysisAdd(parts[0], parts[1]); }
      });
    });
  }

  // ---------------- boot ----------------
  ["dragover", "drop"].forEach(function (t) { window.addEventListener(t, function (e) { e.preventDefault(); }); });
  if (REMOTE) {
    render();                 // tela de carregamento
    refetch();                // primeira leitura
    startStream();            // avisos em tempo real (Server-Sent Events)
    setInterval(function () { if (!document.hidden && pendingWrites === 0) refetch(); }, 30000);   // rede de segurança
  } else {
    try {
      var saved = localStorage.getItem(LS_KEY);
      if (saved) state = normalizeState(JSON.parse(saved));
    } catch (e) {}
    render();
    window.addEventListener("storage", function (e) {          // outras abas do mesmo navegador
      if (e.key !== LS_KEY) return;
      try { state = normalizeState(JSON.parse(e.newValue)); } catch (err) {}
      safeRender();
    });
  }
  function draftIsDirty(d) { return !!d && Object.keys(d).some(function (k) { return String(d[k] || "").trim() && ["category", "phase", "status"].indexOf(k) < 0; }); }
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      if (ui.menuOpen) { ui.menuOpen = false; ui.focusAfter = "[data-action='menu-toggle']"; render(); return; }
      if (ui.formOpen && !draftIsDirty(ui.draft)) { ui.formOpen = false; ui.editingId = null; ui.draft = null; ui.formErrors = {}; render(); return; }
      if (ui.publicFormOpen && !draftIsDirty(ui.publicDraft)) { ui.publicFormOpen = false; ui.editingPublicId = null; ui.publicDraft = null; ui.publicErrors = {}; render(); return; }
      if (ui.importPreview) { ui.importPreview = null; render(); return; }
      hideToast();
    } else if (e.key === "Tab" && ui.menuOpen) {
      var side = document.getElementById("app-menu");
      if (!side) return;
      var f = side.querySelectorAll("button:not([disabled]), a[href]");
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
  if (window.matchMedia) {
    var mq = window.matchMedia("(max-width: 980px)");
    var onMq = function () { if (!mq.matches && ui.menuOpen) { ui.menuOpen = false; render(); } };
    if (mq.addEventListener) mq.addEventListener("change", onMq); else if (mq.addListener) mq.addListener(onMq);
  }
  if (window.__FIGO_TEST__) {
    window.__figoTest = { parseMoney: parseMoney, parsePublicsFromText: parsePublicsFromText, parseJsonPublics: parseJsonPublics, parseCsvPublics: parseCsvPublics };
  }
})();
</script>
</body>
</html>
